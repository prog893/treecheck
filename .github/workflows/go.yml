name: go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: go

jobs:
  test:
    # Both, deliberately. The tool's whole job is filesystem behavior, and the
    # two platforms disagree about enough of it (permission semantics, what a
    # filesystem accepts in a name, how an unreadable directory surfaces) that
    # passing on one says little about the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            gofmt -d .
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 ./...

      # Separate from the plain run: the race detector is the only thing that
      # exercises the display's sharing, and it is slow enough that it should
      # not hide a plain compile or logic failure behind its runtime.
      - name: test -race
        run: go test -race -count=1 ./...

  # The shell implementation is still the reference for behavior, so the two
  # are diffed against each other on every change. This job is what would catch
  # the Go build drifting away from the contract; it is expected to be retired
  # with the shell implementation.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: build
        run: go build -o "$RUNNER_TEMP/tcgo" .
      - name: differential against bin/treecheck
        run: ./difftest.sh "$RUNNER_TEMP/tcgo"
