name: release

# A version tag publishes a GitHub release with prebuilt binaries. A manual run
# builds the same archives and keeps them as workflow artifacts without
# publishing anything, which is how the pipeline is exercised before a tag.
#
# Homebrew is not updated from here. The tap is a separate repository and is
# updated by hand once a release exists; see "Releasing" in CLAUDE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      # The version in main.go is the source of truth and the tag is a copy of
      # it. A tag that disagrees would publish binaries that report a different
      # version from the release they belong to.
      - name: read version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^var version = "\(.*\)"$/\1/p' main.go)
          if [ -z "$version" ]; then
            echo "could not read the version from main.go" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "tag $REF_NAME does not match version $version in main.go" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: test
        run: go test -race -count=1 ./...

      - name: build archives
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="treecheck_${VERSION}_${os}_${arch}"
            mkdir -p "dist/$name"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/$name/treecheck" .
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -r "dist/$name"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: keep archives (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treecheck-${{ steps.version.outputs.version }}
          path: dist/

      - name: publish release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes dist/*.tar.gz dist/SHA256SUMS
